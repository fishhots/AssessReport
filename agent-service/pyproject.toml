[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assess-report-agent"
version = "0.1.0"
description = "LangChain teaching quality report and deep diagnosis agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "pypdf>=5,<7",
  "httpx>=0.28,<1",
  "cryptography>=46,<51",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["assess_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
