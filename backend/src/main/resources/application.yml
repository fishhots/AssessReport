server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: assess-report-api
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 210MB
app:
  storage-directory: ${ASSESS_STORAGE_DIR:./data}
  auth:
    invite-code: ${ASSESS_INVITE_CODE:appmath}
    cookie-secure: ${ASSESS_COOKIE_SECURE:false}
    allowed-origins: ${ASSESS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
    enabled: ${AGENT_ENABLED:true}
    token: ${AGENT_SERVICE_TOKEN:}
